<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | VendorLink</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
    <link rel="stylesheet" href="css/notifications.css">
</head>

<body>

<header>
    <div class="container navbar">
        <div class="logo">
            <h2>Vendor<span>Link</span></h2>
        </div>

        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="browse-events.html">Browse Events</a></li>
                <li><a href="pricing.html">Pricing</a></li>
                <li><a href="about.html">About Us</a></li>
            </ul>
        </nav>

        <div class="buttons">
            <a href="login.html" class="login-btn active">Login</a>
            <a href="register.html" class="register-btn">Join as Vendor</a>
        </div>
    </div>
</header>

<section class="auth">
    <div class="auth-container">
        <div class="auth-left">
            <h1>Welcome Back 👋</h1>
            <p>Login to continue discovering exciting markets and managing your vendor applications.</p>
            <img src="images/login.png" alt="Login" onerror="this.src='images/market1.png'">
        </div>

        <div class="auth-right">
            <form id="login-form">
                <h2>Login</h2>

                <input type="email" id="login-email" placeholder="Email Address" required autocomplete="email">
                <input type="password" id="login-password" placeholder="Password" required
                       autocomplete="current-password">

                <div class="remember">
                    <label>
                        <input type="checkbox" id="login-remember">
                        Remember Me
                    </label>
                    <a href="#">Forgot Password?</a>
                </div>

                <button type="submit" id="login-submit-btn">Login</button>

                <p>
                    Don't have an account?
                    <a href="register.html">Create One</a>
                </p>
            </form>
        </div>
    </div>
</section>

<!-- Axios and Application Scripts -->
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
</body>

</html>
