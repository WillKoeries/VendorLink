spring.application.name=VendorLink
spring.profiles.active=local

spring.datasource.url=jdbc:mysql://localhost:3306/${DB_NAME:vendorlink}?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
app.jwt.secret=${JWT_SECRET:change-me-to-at-least-32-bytes-of-random-secret-value}
app.jwt.ttl-seconds=3600
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}