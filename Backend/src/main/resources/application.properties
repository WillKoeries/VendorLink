spring.application.name=VendorLink
spring.profiles.active=local
spring.config.import=optional:file:.env[.properties],optional:file:Backend/.env[.properties]

# Database Configuration - Supabase / PostgreSQL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${SUPABASE_DB_HOST:aws-1-eu-west-1.pooler.supabase.com}:${SUPABASE_DB_PORT:5432}/${SUPABASE_DB_NAME:postgres}?sslmode=${SUPABASE_SSL_MODE:require}}
spring.datasource.username=${SUPABASE_DB_USER:postgres.ahyhdieaxbhwlreepogy}
spring.datasource.password=${SUPABASE_DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}

# JPA / Hibernate Configuration for PostgreSQL
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# JWT Security
app.jwt.secret=${JWT_SECRET:vendorlink-development-secret-key-must-be-at-least-32-chars}
app.jwt.ttl-seconds=${JWT_TTL_SECONDS:3600}

# CORS Configuration
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:*}
server.port=${PORT:8080}

# PayFast subscription checkout. Keep production credentials in environment variables.
app.payfast.sandbox=${PAYFAST_SANDBOX:true}
app.payfast.merchant-id=${PAYFAST_MERCHANT_ID:10054859}
app.payfast.merchant-key=${PAYFAST_MERCHANT_KEY:dku03dr7i156u}
app.payfast.passphrase=${PAYFAST_PASSPHRASE:}
app.payfast.return-url=${PAYFAST_RETURN_URL:http://localhost:5500/pricing.html?payment=complete}
app.payfast.cancel-url=${PAYFAST_CANCEL_URL:http://localhost:5500/pricing.html?payment=cancelled}
app.payfast.notify-url=${PAYFAST_NOTIFY_URL:http://localhost:8080/api/payfast/itn}
app.payfast.validate-source-ip=${PAYFAST_VALIDATE_SOURCE_IP:true}
app.payfast.simulator.enabled=${PAYFAST_SIMULATOR_ENABLED:false}