spring.application.name=VendorLink-Test
spring.profiles.active=test

# In-Memory Database Configuration for Tests
spring.datasource.url=jdbc:h2:mem:vendorlinkdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.flyway.enabled=false

# JWT Security
app.jwt.secret=test-secret-key-that-is-at-least-32-characters-long-for-hmac!
app.jwt.ttl-seconds=3600

# CORS
app.cors.allowed-origins=http://localhost:3000
