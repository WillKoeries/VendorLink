name: Deploy to Render

on:
  push:
    branches:
      - main

jobs:
  trigger-render-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Deploy Hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          echo "Triggering Render deployment for main branch..."
          if ! response=$(curl --silent --show-error --max-time 30 \
            --request POST "$RENDER_DEPLOY_HOOK_URL" \
            --write-out "\n%{http_code}"); then
            echo "Failed to reach the Render deploy hook."
            exit 1
          fi

          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')

          echo "Response code: $http_code"
          echo "Response body: $body"

          case "$http_code" in
            200|201|202) ;;
            *)
              echo "Failed to trigger Render deployment."
              exit 1
              ;;
          esac
